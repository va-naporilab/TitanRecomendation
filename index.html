<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="NAPOfavicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイタン秘石 おすすめ構成例と解説</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       英雄タイタン おすすめ構成
       元ツール（英雄タイタン強さ評価ツール）のタイタン装備部分を抽出し、
       計算を除いて「おすすめ構成の閲覧」に特化したもの。

       表示の切り替えは基本的に CSS（radio / checkbox + 兄弟セレクタ）で行う。
         ・編成の切り替え  … .team-radio
         ・英雄の表示/非表示 … .hero-check
         ・プリセットの切り替え … .build-radio
       表示形式（シンプル / ゲーム）は .tool の data-mode 属性で切り替える。
         ・シンプル … 英雄ごとに6枠を縦に並べた表。カード幅に応じて Container Query で調整
         ・ゲーム   … ゲームのタイタン画面に合わせ、左に3枠・中央に英雄・右に3枠。英雄は縦に3人
       「自分で選ぶ」プリセットの枠を押すと秘石ピッカー（dialog）が開く。
       ========================================================= */

    :root {
      --bg-0: #0f172a;
      --bg-1: #1e3a8a;
      --glass: rgba(30, 41, 59, 0.55);
      --panel: rgba(15, 23, 42, 0.6);
      --line: rgba(59, 130, 246, 0.3);
      --line-strong: #60a5fa;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --gold: #fde047;
      --atk: #fb923c;   /* 攻撃系スロット（ライフル・視野・ハンディ） */
      --def: #38bdf8;   /* 防御系スロット（アーマー・ヘッド・ブーツ） */
      --img-ratio: 1 / 1;  /* タイタン画像の縦横比。画像に合わせて変更（例: 4 / 3） */
      --img-wide: 4.5rem;  /* カードが広いときの画像の幅 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg-0); }

    body {
      font-family: 'Rajdhani', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 0.75rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ---------- ヘッダー ---------- */
    .header {
      background: linear-gradient(to right, #2563eb, #9333ea);
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.1);
      text-align: center;
    }
    .header h1 {
      font-family: 'Orbitron', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
      font-size: clamp(1.25rem, 4.5vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }
    .header p { color: #bfdbfe; margin-top: 0.25rem; font-size: 1rem; }

    .notice {
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: #fde68a;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    /* ---------- 状態保持用の input は視覚的に隠す（キーボード操作は生かす） ---------- */
    .sr {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* ---------- 表示形式スイッチ ---------- */
    .topbar { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
    .mode-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 0.5rem; overflow: hidden; background: var(--panel); }
    .mode-switch label {
      padding: 0.3rem 0.9rem;
      font-size: 0.9375rem; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-switch input:checked + label { background: #1e40af; color: #fff; }
    .mode-switch input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: -2px; }

    .btn-sm {
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid var(--line);
      background: #1e293b;
      color: var(--soft);
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--line-strong); color: #fff; }
    .btn-sm:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn-accent { background: #1e40af; border-color: var(--line-strong); color: #fff; }

    /* ---------- 編成ナビ（P1〜P6） ---------- */
    .team-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .team-btn {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
      padding: 0.5rem 0.75rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .team-btn:hover { border-color: var(--line-strong); }
    .team-no {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--line-strong);
    }
    .team-heroes { font-size: 0.8125rem; line-height: 1.35; color: var(--soft); }
    .team-heroes span { white-space: nowrap; }

    /* 選択中の編成 */
    .team-radio:nth-of-type(1):checked ~ .team-nav > .team-btn:nth-of-type(1),
    .team-radio:nth-of-type(2):checked ~ .team-nav > .team-btn:nth-of-type(2),
    .team-radio:nth-of-type(3):checked ~ .team-nav > .team-btn:nth-of-type(3),
    .team-radio:nth-of-type(4):checked ~ .team-nav > .team-btn:nth-of-type(4),
    .team-radio:nth-of-type(5):checked ~ .team-nav > .team-btn:nth-of-type(5),
    .team-radio:nth-of-type(6):checked ~ .team-nav > .team-btn:nth-of-type(6) {
      background: #1e40af;
      border-color: var(--line-strong);
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
    }
    .team-radio:nth-of-type(1):checked ~ .team-nav > .team-btn:nth-of-type(1) .team-no,
    .team-radio:nth-of-type(2):checked ~ .team-nav > .team-btn:nth-of-type(2) .team-no,
    .team-radio:nth-of-type(3):checked ~ .team-nav > .team-btn:nth-of-type(3) .team-no,
    .team-radio:nth-of-type(4):checked ~ .team-nav > .team-btn:nth-of-type(4) .team-no,
    .team-radio:nth-of-type(5):checked ~ .team-nav > .team-btn:nth-of-type(5) .team-no,
    .team-radio:nth-of-type(6):checked ~ .team-nav > .team-btn:nth-of-type(6) .team-no { color: #fff; }

    /* キーボードフォーカス */
    .team-radio:nth-of-type(1):focus-visible ~ .team-nav > .team-btn:nth-of-type(1),
    .team-radio:nth-of-type(2):focus-visible ~ .team-nav > .team-btn:nth-of-type(2),
    .team-radio:nth-of-type(3):focus-visible ~ .team-nav > .team-btn:nth-of-type(3),
    .team-radio:nth-of-type(4):focus-visible ~ .team-nav > .team-btn:nth-of-type(4),
    .team-radio:nth-of-type(5):focus-visible ~ .team-nav > .team-btn:nth-of-type(5),
    .team-radio:nth-of-type(6):focus-visible ~ .team-nav > .team-btn:nth-of-type(6) {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* 編成パネルの出し分け */
    .team-panel { display: none; }
    .team-radio:nth-of-type(1):checked ~ .panels > .team-panel:nth-child(1),
    .team-radio:nth-of-type(2):checked ~ .panels > .team-panel:nth-child(2),
    .team-radio:nth-of-type(3):checked ~ .panels > .team-panel:nth-child(3),
    .team-radio:nth-of-type(4):checked ~ .panels > .team-panel:nth-child(4),
    .team-radio:nth-of-type(5):checked ~ .panels > .team-panel:nth-child(5),
    .team-radio:nth-of-type(6):checked ~ .panels > .team-panel:nth-child(6) { display: block; }

    /* ---------- 英雄の表示切り替え ---------- */
    .hero-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .filter-label { font-size: 0.8125rem; font-weight: 600; color: var(--muted); }
    .hero-filter .copy-team { margin-left: auto; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem 0.25rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .chip::before {
      content: '';
      width: 1rem; height: 1rem;
      border: 1.5px solid currentColor;
      border-radius: 0.25rem;
      display: inline-grid;
      place-content: center;
      font-size: 0.7rem;
      line-height: 1;
    }
    .hero-check:nth-of-type(1):checked ~ .hero-filter > .chip:nth-of-type(1),
    .hero-check:nth-of-type(2):checked ~ .hero-filter > .chip:nth-of-type(2),
    .hero-check:nth-of-type(3):checked ~ .hero-filter > .chip:nth-of-type(3) {
      background: #1e40af;
      border-color: var(--line-strong);
      color: var(--gold);
    }
    .hero-check:nth-of-type(1):checked ~ .hero-filter > .chip:nth-of-type(1)::before,
    .hero-check:nth-of-type(2):checked ~ .hero-filter > .chip:nth-of-type(2)::before,
    .hero-check:nth-of-type(3):checked ~ .hero-filter > .chip:nth-of-type(3)::before {
      content: '✓';
      background: var(--gold);
      border-color: var(--gold);
      color: #1e3a8a;
      font-weight: 700;
    }
    .hero-check:nth-of-type(1):focus-visible ~ .hero-filter > .chip:nth-of-type(1),
    .hero-check:nth-of-type(2):focus-visible ~ .hero-filter > .chip:nth-of-type(2),
    .hero-check:nth-of-type(3):focus-visible ~ .hero-filter > .chip:nth-of-type(3) {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* 非表示にした英雄のカード */
    .hero-check:nth-of-type(1):not(:checked) ~ .hero-grid > .hero-card:nth-child(1),
    .hero-check:nth-of-type(2):not(:checked) ~ .hero-grid > .hero-card:nth-child(2),
    .hero-check:nth-of-type(3):not(:checked) ~ .hero-grid > .hero-card:nth-child(3) { display: none; }

    /* 3体とも非表示のときの案内 */
    .hero-empty {
      display: none;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 0.5rem;
    }
    .hero-check:nth-of-type(1):not(:checked) ~ .hero-check:nth-of-type(2):not(:checked) ~ .hero-check:nth-of-type(3):not(:checked) ~ .hero-empty { display: block; }

    /* ---------- 英雄カード（3体を横並びで同時表示） ---------- */
    .hero-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr); /* 表示中の英雄数で等分 */
      gap: 0.4rem;
      align-items: start;
    }
    .hero-card {
      position: relative;
      container-type: inline-size;
      container-name: hero;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.5rem;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25), inset 0 0 20px rgba(59, 130, 246, 0.08);
      min-width: 0;
    }

    /* 「秘石の選び方」を開くボタン。カード右上に固定表示。 */
    .tip-btn {
      position: absolute; top: 0.5rem; right: 0.5rem; z-index: 4;
      display: inline-flex; align-items: center; gap: 0.25rem;
      font: inherit; font-size: 0.75rem; font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(253, 224, 71, 0.55);
      background: rgba(15, 23, 42, 0.65);
      color: var(--gold);
      cursor: pointer;
      line-height: 1.4;
    }
    .tip-btn:hover { background: rgba(253, 224, 71, 0.18); }
    .tip-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .tip-btn .q { display: inline-grid; place-content: center; width: 1rem; height: 1rem; border-radius: 50%; border: 1.5px solid currentColor; font-size: 0.6875rem; }
    .tip-btn .label { display: none; }
    @container hero (min-width: 15rem) { .tip-btn .label { display: inline; } }

    /* 英雄ヘッダー */
    .hero-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .portrait {
      position: relative;
      width: 2.75rem; height: 2.75rem;
      border-radius: 50%;
      overflow: hidden;
      flex: none;
      border: 2px solid var(--line-strong);
      background: linear-gradient(135deg, #1e40af, #7e22ce);
    }
    .portrait-ph {
      position: absolute; inset: 0;
      display: grid; place-content: center;
      font-size: 1.25rem; font-weight: 700; color: rgba(255, 255, 255, 0.85);
    }
    .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--gold);
      min-height: 2.5em;             /* 2行分を確保して、カード間で高さを揃える */
      display: flex; align-items: center; justify-content: center;
    }
    .hero-note { font-size: 0.75rem; color: var(--muted); }

    /* ---------- シンプル表示：英雄バナー ----------
       画像の表示領域を「高さ基準の正方形（1:1）」に固定し、上端合わせでクロップする。
       カード幅が変わっても正方形のサイズ自体は変わらないので、常に同じ範囲が写る。
       はみ出す左右は hero-head 自身の背景（不透明）が見え、名前は下端のフェード上に重なる。 */
    .tool[data-mode="simple"] .hero-head {
      --banner-h: 5.75rem;   /* 正方形の一辺（＝画像の表示高さ）。ここを変えると全体のサイズ感が変わる */
      position: relative;
      justify-content: flex-end;
      height: var(--banner-h);
      margin-bottom: 0.4rem;
      padding: 0.25rem 0.4rem 0.3rem;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        radial-gradient(140% 90% at 50% 100%, rgba(59, 130, 246, 0.35), transparent 60%),
        linear-gradient(165deg, #1e293b, #0b1220);
    }
    .tool[data-mode="simple"] .portrait {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: var(--banner-h); height: var(--banner-h);  /* 高さを基準にした正方形。幅方向には依存しない */
      border: 0; border-radius: 0;
      background: none;
    }
    .tool[data-mode="simple"] .portrait-ph { font-size: 2rem; color: rgba(255, 255, 255, 0.18); }
    .tool[data-mode="simple"] .portrait.has-img .portrait-ph { display: none; }
    .tool[data-mode="simple"] .portrait img {
      object-position: top center;
      opacity: 0.52;
      -webkit-mask-image:
        linear-gradient(to bottom, #000 0%, #000 60%, transparent 94%),
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
      -webkit-mask-composite: source-in;
              mask-image:
        linear-gradient(to bottom, #000 0%, #000 60%, transparent 94%),
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
              mask-composite: intersect;
    }
    .tool[data-mode="simple"] .hero-name {
      position: relative;
      min-height: 0;
      font-size: 1.125rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.6);
    }
    .tool[data-mode="simple"] .hero-note {
      position: relative;
      color: #e2e8f0;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* 構成パターン切り替え。
       編成内に構成が複数ある英雄がいる場合、全カードに同じ高さのタブ欄を設けて
       スロットの行が横並びで揃うようにする（--tabs = 編成内の最大構成数）。 */
    .build-tabs {
      display: grid;
      align-content: start;
      gap: 0.2rem;
      margin-bottom: 0.4rem;
      min-height: calc(var(--tabs, 1) * 1.4rem + (var(--tabs, 1) - 1) * 0.2rem);
    }
    .build-tabs > label,
    .build-tabs > .build-tag {
      display: block;
      height: 1.4rem;
      line-height: calc(1.4rem - 2px);
      padding: 0 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .build-tabs > label { cursor: pointer; }
    .build-tabs > .build-tag { border-style: dashed; }
    .build-radio:nth-of-type(1):checked ~ .build-tabs > label:nth-of-type(1),
    .build-radio:nth-of-type(2):checked ~ .build-tabs > label:nth-of-type(2),
    .build-radio:nth-of-type(3):checked ~ .build-tabs > label:nth-of-type(3),
    .build-radio:nth-of-type(4):checked ~ .build-tabs > label:nth-of-type(4),
    .build-radio:nth-of-type(5):checked ~ .build-tabs > label:nth-of-type(5),
    .build-radio:nth-of-type(6):checked ~ .build-tabs > label:nth-of-type(6) {
      background: #1e40af;
      border-color: var(--line-strong);
      color: #fff;
    }
    .build-radio:nth-of-type(1):focus-visible ~ .build-tabs > label:nth-of-type(1),
    .build-radio:nth-of-type(2):focus-visible ~ .build-tabs > label:nth-of-type(2),
    .build-radio:nth-of-type(3):focus-visible ~ .build-tabs > label:nth-of-type(3),
    .build-radio:nth-of-type(4):focus-visible ~ .build-tabs > label:nth-of-type(4),
    .build-radio:nth-of-type(5):focus-visible ~ .build-tabs > label:nth-of-type(5),
    .build-radio:nth-of-type(6):focus-visible ~ .build-tabs > label:nth-of-type(6) {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* 表示中のプリセット。--show はゲーム表示で contents に切り替える */
    .build { display: none; }
    .build:only-child,
    .build-radio:nth-of-type(1):checked ~ .builds > .build:nth-child(1),
    .build-radio:nth-of-type(2):checked ~ .builds > .build:nth-child(2),
    .build-radio:nth-of-type(3):checked ~ .builds > .build:nth-child(3),
    .build-radio:nth-of-type(4):checked ~ .builds > .build:nth-child(4),
    .build-radio:nth-of-type(5):checked ~ .builds > .build:nth-child(5),
    .build-radio:nth-of-type(6):checked ~ .builds > .build:nth-child(6) { display: var(--show, block); }

    .build-foot { margin-top: 0.4rem; display: grid; gap: 0.4rem; }
    .build-note { font-size: 0.75rem; color: var(--muted); text-align: center; }

    /* 「自分で選ぶ」プリセットのツールバー */
    .edit-bar {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 0.35rem;
      padding: 0.4rem;
      border: 1px dashed rgba(253, 224, 71, 0.5);
      border-radius: 0.375rem;
      background: rgba(253, 224, 71, 0.06);
    }
    .edit-tag { width: 100%; text-align: center; font-size: 0.75rem; color: var(--gold); }
    .edit-bar .btn-sm { font-size: 0.75rem; padding: 0.15rem 0.5rem; }
    .copy-from {
      font: inherit; font-size: 0.75rem; font-weight: 600;
      max-width: 100%;
      padding: 0.15rem 0.3rem;
      border-radius: 0.375rem;
      border: 1px solid var(--line);
      background: #1e293b;
      color: var(--soft);
    }

    /* ---------- タイタン6スロット ---------- */
    .slots { list-style: none; display: grid; gap: 0.4rem; }
    .tool[data-mode="simple"] .slots { gap: 0.3rem; }

    .slot {
      --accent: var(--atk);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "name" "img" "eff" "lv";
      justify-items: center;
      row-gap: 0.25rem;
      padding: 0.4rem 0.3rem;
      background: var(--panel);
      border-left: 3px solid var(--accent);
      border-radius: 0.375rem;
      text-align: center;
    }
    .slot[data-kind="def"] { --accent: var(--def); }
    .slot { position: relative; }
    .slot-name { flex-wrap: wrap; justify-content: center; }

    /* 編集できる枠（「自分で選ぶ」プリセットのみ） */
    .slot-edit {
      position: absolute; inset: 0; z-index: 2;
      border: 0; background: transparent;
      border-radius: inherit;
      cursor: pointer;
    }
    .slot-edit:hover { background: rgba(253, 224, 71, 0.08); outline: 1px solid rgba(253, 224, 71, 0.6); }
    .slot-edit:focus-visible { outline: 2px solid var(--gold); }
    .slot.is-editable::after {
      content: '✎';
      position: absolute; top: 0.1rem; right: 0.3rem; z-index: 3;
      font-size: 0.8rem; color: var(--gold); opacity: 0.85;
      pointer-events: none;
    }

    .slot-name {
      grid-area: name;
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.75rem; font-weight: 600; color: var(--soft);
    }
    .ico { width: 1rem; height: 1rem; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    .slot-img {
      grid-area: img;
      position: relative;
      width: 100%;
      max-width: 5.5rem;
      aspect-ratio: var(--img-ratio);
      border-radius: 0.375rem;
      overflow: hidden;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      background: repeating-linear-gradient(135deg, rgba(148,163,184,0.08) 0 6px, transparent 6px 12px);
    }
    .slot-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .slot-ph { position: absolute; inset: 0; display: grid; place-content: center; }
    .slot-ph .ico { width: 1.75rem; height: 1.75rem; opacity: 0.4; }
    .slot-img.has-img { border-style: solid; border-color: rgba(148, 163, 184, 0.25); background: rgba(15, 23, 42, 0.5); }
    .slot-img.has-img .slot-ph { display: none; }

    .slot-eff { grid-area: eff; min-width: 0; }
    .slot-eff b { display: block; font-size: 0.9375rem; font-weight: 700; line-height: 1.25; }
    .slot-eff small { display: block; font-size: 0.6875rem; line-height: 1.3; color: var(--muted); min-height: 2.6em; }

    .slot-lv { grid-area: lv; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .lv-num { font-size: 0.875rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .pips { display: flex; gap: 2px; }
    .pips i { width: 0.5rem; height: 0.25rem; border-radius: 1px; background: rgba(148, 163, 184, 0.3); }
    .pips i.on { background: var(--accent); }

    .slot.is-empty .slot-eff b { color: var(--muted); font-weight: 500; }
    .slot.is-empty .slot-lv { visibility: hidden; }

    /* ---------- シンプル表示：狭い幅（スマホの3列表示など）でのデフォルト ----------
       17rem 未満のカードでは、横並びは保ちつつ画像を小さく・Lv表示を省略して、
       6スロット×3英雄がスマホの画面縦幅にも収まりやすい高さにする。
       17rem 以上のときは下の @container ブロックで通常サイズに戻す。 */
    .tool[data-mode="simple"] .slot {
      grid-template-columns: 2.5rem minmax(0, 1fr);
      grid-template-areas: "img name" "img eff";
      justify-items: start;
      align-items: center;
      column-gap: 0.45rem;
      row-gap: 0.05rem;
      padding: 0.26rem 0.4rem 0.26rem 0.3rem;
      text-align: left;
    }
    .tool[data-mode="simple"] .slot-img { max-width: 2.5rem; }
    .tool[data-mode="simple"] .slot-name {
      font-size: 0.625rem; justify-content: flex-start; flex-wrap: nowrap;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tool[data-mode="simple"] .slot-name .ico { width: 0.75rem; height: 0.75rem; }
    .tool[data-mode="simple"] .slot-eff b {
      font-size: 0.875rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tool[data-mode="simple"] .slot-eff small {
      font-size: 0.5625rem; min-height: 0; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tool[data-mode="simple"] .slot-lv { display: none; }   /* 横幅が足りないので省略（「自分で選ぶ」なら枠を押せばLvを確認・変更できる） */

    /* ---------- シンプル表示：カードが広いとき、画像・Lv表示を通常サイズに戻す ---------- */
    @container hero (min-width: 17rem) {
      .tool[data-mode="simple"] .hero-name { font-size: 1.25rem; }

      .tool[data-mode="simple"] .slot {
        grid-template-columns: var(--img-wide) minmax(0, 1fr) auto;
        grid-template-areas:
          "img name lv"
          "img eff  lv";
        column-gap: 0.75rem;
        row-gap: 0.1rem;
        padding: 0.4rem 0.6rem 0.4rem 0.4rem;
      }
      .tool[data-mode="simple"] .slot-img { max-width: none; width: var(--img-wide); }
      .tool[data-mode="simple"] .slot-name {
        font-size: 0.75rem; flex-wrap: wrap;
        white-space: normal; overflow: visible; text-overflow: clip;
      }
      .tool[data-mode="simple"] .slot-name .ico { width: 1rem; height: 1rem; }
      .tool[data-mode="simple"] .slot-eff b {
        font-size: 1.0625rem;
        white-space: normal; overflow: visible; text-overflow: clip;
      }
      .tool[data-mode="simple"] .slot-eff small {
        font-size: 0.625rem; -webkit-line-clamp: unset; display: block; overflow: visible;
      }
      .tool[data-mode="simple"] .build-tabs { display: flex; justify-content: center; min-height: 1.4rem; }
      .tool[data-mode="simple"] .slot-lv { display: flex; align-items: flex-end; gap: 0.3rem; }
      .tool[data-mode="simple"] .lv-num { font-size: 0.9375rem; }
      .tool[data-mode="simple"] .pips i { width: 0.6rem; }
    }

    /* =========================================================
       ゲーム表示
       hero-card を 3列グリッド（左3枠 | 英雄 | 右3枠）にする。
       .builds / .build / .slots は display: contents にして、
       6つの .slot を直接グリッドに配置する（並び順 = ゲームの配置）。
         左: ライフル・アーマー・視野 / 右: ヘッドセット・ハンディGPS・ブーツ

       左右の枠幅は固定値（--game-side-w）にして、画面幅が狭くなっても
       枠・英雄画像が一緒に縮んでいかないようにする（最小幅の目安 ~340px）。
       英雄画像は「高さ」を基準に領域を確保し（＝固定した3行分の高さ）、
       幅は object-fit: contain でその高さに追従させる（幅に無理に合わせない）。
       画面が十分広いときだけ中央カラムが伸びる。狭い画面ではこのカードの
       最小幅を下回った分だけ横スクロールになる。 */
    .tool[data-mode="game"] { --show: contents; --game-side-w: 5rem; }
    .tool[data-mode="game"] .team-panel { max-width: 36rem; margin-inline: auto; overflow-x: auto; }
    .tool[data-mode="game"] .hero-grid {
      grid-auto-flow: row;
      grid-auto-columns: auto;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
    }
    .tool[data-mode="game"] .builds,
    .tool[data-mode="game"] .slots { display: contents; }

    .tool[data-mode="game"] .hero-card {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: var(--game-side-w) minmax(6rem, 1fr) var(--game-side-w);
      justify-content: center;
      grid-template-rows: auto repeat(3, auto) auto;
      gap: 0.5rem;
      padding: 0.6rem;
      background:
        radial-gradient(ellipse 70% 40% at 50% 62%, rgba(34, 211, 238, 0.22), transparent 70%),
        linear-gradient(180deg, #0c2a4d 0%, #071426 100%);
      border-color: rgba(103, 232, 249, 0.45);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.2), inset 0 0 30px rgba(8, 47, 73, 0.6);
    }

    /* 左右の光る帯（ゲームのサイドパネル） */
    .tool[data-mode="game"] .hero-card::before,
    .tool[data-mode="game"] .hero-card::after {
      content: '';
      z-index: -1;
      grid-row: 2 / span 3;
      border: 1px solid rgba(103, 232, 249, 0.6);
      box-shadow: inset 0 0 14px rgba(34, 211, 238, 0.3), 0 0 12px rgba(34, 211, 238, 0.25);
    }
    .tool[data-mode="game"] .hero-card::before {
      grid-column: 1;
      border-radius: 1.6rem 0.5rem 0.5rem 1.6rem;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.38), rgba(14, 116, 144, 0.14));
    }
    .tool[data-mode="game"] .hero-card::after {
      grid-column: 3;
      border-radius: 0.5rem 1.6rem 1.6rem 0.5rem;
      background: linear-gradient(270deg, rgba(34, 211, 238, 0.38), rgba(14, 116, 144, 0.14));
    }

    /* 上段：プリセット選択（ゲームの「セット」欄に相当）。
       右上の「秘石の選び方」ボタンと重ならないよう、アイコンのみにして余白を空ける。 */
    .tool[data-mode="game"] .build-tabs {
      grid-column: 1 / -1; grid-row: 1;
      display: flex; flex-wrap: wrap; justify-content: center;
      min-height: 0; margin: 0;
      padding-right: 2.6rem;
    }
    .tool[data-mode="game"] .tip-btn .label { display: none; }
    .tool[data-mode="game"] .build-tabs > label,
    .tool[data-mode="game"] .build-tabs > .build-tag { background: rgba(8, 47, 73, 0.7); border-color: rgba(103, 232, 249, 0.4); }

    /* 中央：英雄 */
    .tool[data-mode="game"] .hero-head {
      grid-column: 2; grid-row: 2 / span 3;
      display: flex; flex-direction: column; align-items: stretch;
      gap: 0.4rem; margin: 0;
    }
    .tool[data-mode="game"] .portrait {
      flex: 1;
      width: 100%; height: auto; min-height: 9rem;
      max-width: 11.5rem;           /* 幅は高さの半分程度が上限（縦2:横1）。画面が広くてもこれ以上横に伸ばさない */
      align-self: center;
      border-radius: 0.75rem;
      border: 1px solid rgba(103, 232, 249, 0.35);
      background:
        radial-gradient(ellipse 60% 45% at 50% 92%, rgba(34, 211, 238, 0.55), transparent 70%),
        linear-gradient(180deg, rgba(14, 116, 144, 0.25), rgba(8, 47, 73, 0.7));
    }
    /* 足元の台座 */
    .tool[data-mode="game"] .portrait::after {
      content: '';
      position: absolute; left: 12%; right: 12%; bottom: 4%; height: 12%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(207, 250, 254, 0.9) 0, rgba(34, 211, 238, 0.45) 50%, transparent 72%);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.35), 0 0 18px rgba(34, 211, 238, 0.6);
    }
    .tool[data-mode="game"] .portrait-ph { font-size: 3.5rem; color: rgba(165, 243, 252, 0.8); text-shadow: 0 0 18px rgba(34, 211, 238, 0.8); }
    .tool[data-mode="game"] .portrait img { z-index: 1; object-fit: contain; object-position: center bottom; }
    .tool[data-mode="game"] .hero-name {
      min-height: 0;
      padding: 0.35rem 0.4rem;
      border: 1px solid rgba(103, 232, 249, 0.7);
      border-radius: 0.5rem;
      background: linear-gradient(180deg, rgba(14, 116, 144, 0.7), rgba(8, 47, 73, 0.9));
      color: #fff;
      font-size: 1.0625rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* 左右の6枠 */
    .tool[data-mode="game"] .slot:nth-child(-n+3) { grid-column: 1; }
    .tool[data-mode="game"] .slot:nth-child(n+4)  { grid-column: 3; }
    .tool[data-mode="game"] .slot:nth-child(1), .tool[data-mode="game"] .slot:nth-child(4) { grid-row: 2; }
    .tool[data-mode="game"] .slot:nth-child(2), .tool[data-mode="game"] .slot:nth-child(5) { grid-row: 3; }
    .tool[data-mode="game"] .slot:nth-child(3), .tool[data-mode="game"] .slot:nth-child(6) { grid-row: 4; }

    .tool[data-mode="game"] .slot {
      grid-template-areas: "img" "eff" "lv";
      row-gap: 0.2rem;
      padding: 0.35rem 0.2rem;
      background: none;
      border-left: 0;
    }
    .tool[data-mode="game"] .slot-name { display: none; }
    .tool[data-mode="game"] .slot-img {
      width: 100%;
      max-width: var(--game-side-w);
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line-strong);
      border-color: color-mix(in srgb, var(--accent) 60%, #67e8f9);
      border-radius: 0.6rem;
      background: linear-gradient(160deg, rgba(30, 64, 175, 0.55), rgba(8, 47, 73, 0.9));
      box-shadow: inset 0 0 12px rgba(34, 211, 238, 0.25);
    }
    .tool[data-mode="game"] .slot-img.has-img { border-style: solid; }
    .tool[data-mode="game"] .slot-eff b { font-size: 0.875rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool[data-mode="game"] .slot-eff small { display: none; }
    .tool[data-mode="game"] .slot.is-empty .slot-lv { display: none; }
    .tool[data-mode="game"] .lv-num { font-size: 0.9375rem; }

    .tool[data-mode="game"] .build-foot { grid-column: 1 / -1; grid-row: 5; margin-top: 0.25rem; }
    .tool[data-mode="game"] .edit-bar { border-color: rgba(253, 224, 71, 0.6); background: rgba(8, 47, 73, 0.6); }

    /* ---------- 秘石ピッカー / JSON表示 / トースト ---------- */
    dialog {
      color: var(--text);
      background: #0f172a;
      border: 1px solid var(--line-strong);
      border-radius: 0.75rem;
      padding: 0;
      width: min(34rem, calc(100vw - 1.5rem));
      max-height: 88vh;
      overflow: auto;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.45);
    }
    dialog { margin: auto; }
    dialog::backdrop { background: rgba(2, 6, 23, 0.72); }
    .dlg-title .ico { stroke: var(--gold); vertical-align: -3px; }
    .dlg-body { padding: 0.9rem 1rem 1rem; }
    .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.5rem; }
    .dlg-title { font-size: 1.125rem; font-weight: 700; color: var(--gold); }
    .dlg-sub { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin: 0.6rem 0 0.3rem; }
    .dlg-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin: 0.6rem 0 0.3rem; }
    .dlg-sub-row .dlg-sub { margin: 0; }
    .tip-sort { display: inline-flex; gap: 0.25rem; }
    .tip-sort button { font-size: 0.6875rem; padding: 0.15rem 0.5rem; }

    .pk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.4rem; }
    .pk-eff {
      --accent: var(--atk);
      display: grid; grid-template-columns: 2.5rem 1fr auto; column-gap: 0.5rem; align-items: center;
      text-align: left;
      font: inherit; color: var(--text);
      padding: 0.35rem 0.5rem 0.35rem 0.35rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 0.375rem;
      background: var(--panel);
      cursor: pointer;
    }
    .pk-eff[data-kind="def"] { --accent: var(--def); }
    .pk-eff:hover { border-color: var(--line-strong); border-left-color: var(--accent); }
    .pk-eff[aria-pressed="true"] { background: #1e40af; border-color: var(--line-strong); border-left-color: var(--accent); }
    .pk-eff.pk-none { grid-template-columns: 1fr; text-align: center; color: var(--muted); border-left-color: var(--line); }
    .pk-eff b { display: block; grid-column: 2; grid-row: 1; font-size: 0.9375rem; line-height: 1.2; }
    .pk-eff small { display: block; grid-column: 2; grid-row: 2; font-size: 0.6875rem; color: var(--muted); line-height: 1.25; }
    .pk-eff[aria-pressed="true"] small { color: #bfdbfe; }
    .pk-eff .pk-grade { grid-column: 3; grid-row: 1 / 3; align-self: center; justify-self: end; margin-top: 0; }
    .pk-thumb {
      position: relative; grid-column: 1; grid-row: 1 / 3;
      width: 2.5rem; height: 2.5rem;
      border-radius: 0.3rem; overflow: hidden;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
    }
    .pk-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .pk-thumb .slot-ph .ico { width: 1.25rem; height: 1.25rem; }
    .pk-thumb.has-img { border-style: solid; }
    .pk-thumb.has-img .slot-ph { display: none; }

    .pk-lv { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .pk-lv button {
      font: inherit; font-weight: 700; color: var(--soft);
      min-width: 3rem; padding: 0.3rem 0.6rem;
      border: 1px solid var(--line); border-radius: 0.375rem;
      background: var(--panel);
      cursor: pointer;
    }
    .pk-lv button:hover:not(:disabled) { border-color: var(--line-strong); color: #fff; }
    .pk-lv button[aria-pressed="true"] { background: #1e40af; border-color: var(--line-strong); color: #fff; }
    .pk-lv button:disabled { opacity: 0.35; cursor: not-allowed; }
    .pk-none-hint { font-size: 0.75rem; color: var(--muted); }
    dialog button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .json-text {
      width: 100%; min-height: 14rem;
      font: 0.8125rem/1.5 ui-monospace, 'SFMono-Regular', Consolas, monospace;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 0.375rem;
      padding: 0.5rem;
      resize: vertical;
    }

    /* ---------- 秘石の選び方ドロワー（画面右側からスライド表示） ---------- */
    #tipsdlg {
      position: fixed; inset: 0 0 0 auto; margin: 0;
      width: min(26rem, 92vw);
      height: 100vh; height: 100dvh;
      max-height: none;
      border-radius: 0.75rem 0 0 0.75rem;
      border-width: 0 0 0 1px;
      animation: tip-in 0.18s ease-out;
    }
    #tipsdlg::backdrop { background: rgba(2, 6, 23, 0.6); }
    @keyframes tip-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { #tipsdlg { animation: none; } }
    #tipsdlg .dlg-body { padding: 1rem; height: 100%; overflow-y: auto; }
    .tip-desc {
      font-size: 0.9375rem; line-height: 1.7; color: var(--soft);
      background: var(--panel); border: 1px solid var(--line); border-radius: 0.5rem;
      padding: 0.6rem 0.75rem; margin-bottom: 1rem; white-space: pre-wrap;
    }
    .tip-desc.is-placeholder { color: var(--muted); font-style: italic; }

    .tip-legend { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.6rem; }
    .tip-legend b { color: var(--soft); }

    .tip-table { display: grid; gap: 0.3rem; }
    .tip-row {
      --accent: var(--atk);
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      background: var(--panel);
      border-left: 3px solid var(--accent);
      border-radius: 0.375rem;
    }
    .tip-row[data-kind="def"] { --accent: var(--def); }
    .tip-row .stone-name { font-size: 0.875rem; font-weight: 600; }

    .grade {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 2.75rem; padding: 0.15rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.8125rem; font-weight: 800; letter-spacing: 0.02em;
      color: #0b1220;
      background: var(--g-color, #64748b);
      filter: brightness(var(--g-bright, 1));
    }
    .grade.g-f  { background: transparent; border: 1px solid rgba(148, 163, 184, 0.4); color: var(--muted); font-weight: 600; }
    .grade.g-na { background: transparent; border: 1px dashed rgba(148, 163, 184, 0.35); color: var(--muted); font-weight: 600; font-size: 0.75rem; }

    .toast {
      position: fixed; left: 50%; bottom: 1.25rem; z-index: 50;
      transform: translateX(-50%);
      max-width: calc(100vw - 2rem);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      background: #166534; border: 1px solid #86efac; color: #dcfce7;
      font-weight: 600; font-size: 0.9375rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .toast[hidden] { display: none; }

    /* ---------- 効果一覧（折りたたみ） ---------- */
    .ref {
      margin-top: 1.5rem;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
    }
    .ref summary { cursor: pointer; font-weight: 700; color: var(--line-strong); padding: 0.25rem 0; }
    .ref-legend { display: flex; gap: 1rem; font-size: 0.8125rem; color: var(--soft); margin: 0.5rem 0; }
    .ref-legend span::before { content: ''; display: inline-block; width: 0.75rem; height: 0.75rem; margin-right: 0.35rem; border-radius: 2px; vertical-align: -1px; background: var(--atk); }
    .ref-legend span[data-kind="def"]::before { background: var(--def); }
    .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0.5rem; padding-bottom: 0.5rem; }
    .ref-slot { --accent: var(--atk); background: var(--panel); border-left: 3px solid var(--accent); border-radius: 0.375rem; padding: 0.5rem 0.75rem; }
    .ref-slot[data-kind="def"] { --accent: var(--def); }
    .ref-slot h3 { display: flex; align-items: center; gap: 0.35rem; font-size: 0.9375rem; margin-bottom: 0.25rem; }
    .ref-slot ul { list-style: none; display: grid; gap: 0.15rem; font-size: 0.8125rem; }
    .ref-slot li { display: flex; justify-content: space-between; gap: 0.5rem; }
    .ref-slot li span { color: var(--muted); text-align: right; }

    .stone-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 0.6rem; padding-bottom: 0.5rem; }
    .stone-info-card { --accent: var(--atk); background: var(--panel); border-left: 3px solid var(--accent); border-radius: 0.375rem; padding: 0.6rem 0.75rem; }
    .stone-info-card[data-kind="def"] { --accent: var(--def); }
    .stone-info-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
    .stone-info-name { font-size: 0.9375rem; font-weight: 700; color: var(--soft); }
    .stone-info-desc { font-size: 0.8125rem; color: var(--muted); }
    .stone-info-levels { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.4rem 0 0.5rem; }
    .stone-info-lv { display: inline-flex; align-items: baseline; gap: 0.25rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--line); border-radius: 0.3rem; padding: 0.1rem 0.4rem; font-size: 0.75rem; }
    .stone-info-lv b { font-size: 0.6875rem; font-weight: 700; color: var(--line-strong); }
    .stone-info-note { font-size: 0.8125rem; line-height: 1.6; color: var(--soft); white-space: pre-wrap; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    @media (min-width: 720px) {
      body { padding: 1.25rem; }
      .hero-grid { gap: 0.75rem; }
      .hero-card { padding: 0.75rem; }
    }

    /* ---------- 携帯幅では、ヘッダーや編成ナビなど本題以外の余白も詰める ----------
       6スロット×3英雄をなるべく1画面に収めるための追加圧縮。 */
    @media (max-width: 480px) {
      .header { padding: 0.65rem 0.9rem; margin-bottom: 0.6rem; }
      .header h1 { font-size: clamp(1.0625rem, 5.5vw, 1.375rem); }
      .header p { font-size: 0.75rem; margin-top: 0.15rem; }
      .topbar { margin-bottom: 0.5rem; }
      .team-nav { gap: 0.35rem; margin-bottom: 0.6rem; }
      .team-btn { padding: 0.35rem 0.5rem; gap: 0.05rem; }
      .team-no { font-size: 0.75rem; }
      .team-heroes { font-size: 0.6875rem; }
      .hero-filter { gap: 0.35rem; margin-bottom: 0.5rem; }
      .chip { padding: 0.15rem 0.6rem 0.15rem 0.4rem; font-size: 0.8125rem; }
      .hero-grid { gap: 0.3rem; }
      .hero-card { padding: 0.4rem; }
      .tool[data-mode="simple"] .hero-head { --banner-h: 4.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>タイタン秘石 おすすめ構成例と解説</h1>
      <p>編成を選んで、3英雄のタイタン設定を並べて確認できます</p>
    </header>

    <div id="notice" class="notice" hidden>英雄画像・秘石画像が未設定です。images フォルダに画像を置くと自動で表示されます。</div>

    <main id="app" class="tool" data-mode="simple"></main>
    <noscript><p class="notice">このページの表示には JavaScript が必要です。</p></noscript>

    <details class="ref">
      <summary>各秘石の説明・合成レベルと効果</summary>
      <div class="ref-legend"><span data-kind="atk">攻撃系秘石</span><span data-kind="def">防御系秘石</span></div>
      <div id="stone-info-grid" class="stone-info-grid"></div>
    </details>

    <details class="ref">
      <summary>各部位につけれる秘石の一覧</summary>
      <div class="ref-legend"><span data-kind="atk">攻撃系スロット</span><span data-kind="def">防御系スロット</span></div>

<script>
/* =========================================================
   設定・データ
   ========================================================= */

// 仮データ表示のお知らせ。本番データに差し替えたら false にする
const SHOW_SAMPLE_NOTICE = false;

/* ---------- 画像の置き場所 ----------
   英雄画像  : images/heroes/{英雄名}.png
   効果画像  : images/titan/{効果名}.png   （例: images/titan/戦場洞察.png）
   ファイルが無い場合は自動でプレースホルダー表示になる。
   個別に差し替えたい場合は、下の TEAMS で英雄の img / スロットの3番目の値にパスを指定する。 */
const IMAGE_CONFIG = {
  heroDir: 'images/heroes/',
  effectDir: 'images/titan/',
  ext: 'png'
};

/* ---------- スロット定義（元ツールの titanEffects / slotNames より） ----------
   effects: [効果名, 説明, 最大Lv]
   kind   : atk = 攻撃系 / def = 防御系（表示色の区別用） */
const ATK_MAIN = [['戦場洞察','ダメ増バフ加算',7], ['衝撃','衰弱付与',3], ['灼熱','燃焼付与',3], ['磁場','磁気付与',3], ['破鎧','脆弱付与',3]];

const SLOTS = [
  { key: 'rifle',  label: 'ライフル', kind: 'atk', effects: [['戦場洞察','ダメ増バフ加算',3], ...ATK_MAIN.slice(1), ['砲撃の嵐','攻撃強化の強化',7], ['全軍突撃','R1のみ追撃２回発動',7]] },
  { key: 'armor',  label: 'アーマー', kind: 'def', effects: [['補足不能','ダメ減バフ加算',3], ...DEF_MAIN.slice(1), ['鋼の奔流','開戦シールドの強化',7], ['破壊不能','鉄壁１ラウンド追加',7]] },
  { key: 'vision', label: '視野',     kind: 'atk', effects: ATK_MAIN },
  { key: 'head',   label: 'ヘッドセット', kind: 'def', effects: DEF_MAIN },
  { key: 'handy',  label: 'ハンディGPS', kind: 'atk', effects: ATK_MAIN },
  { key: 'boots',  label: 'ブーツ',   kind: 'def', effects: DEF_MAIN }

/* ---------- おすすめ構成データ ----------
   TEAMS[0] = P1 … TEAMS[5] = P6（元ツールのプリセットと同じ編成）

   hero(英雄名, [構成, ...], { img, note })
   build(スロット6個, 構成名, 補足)
   スロットは [効果名, Lv] または [効果名, Lv, 画像パス]。未設定は null。
   並び順: ライフル / アーマー / 視野 / ヘッドセット / ハンディGPS / ブーツ
   （ゲーム表示では 前半3つが左、後半3つが右に並ぶ）

   ブラウザ上で編集できる「自分で選ぶ」プリセットが自動で1つ付く。
   構成を2つ以上渡すと、カード内に切り替えタブが出る。 */
const hero  = (name, builds, opts = {}) => ({ name, builds, ...opts });
const build = (slots, label = 'おすすめ例', note = '') => ({ label, note, slots });

const TEAMS = [

      build([['磁場',3], ['鋼の奔流',3], ['戦場洞察',3], ['着磁',3], ['戦場洞察',3], ['着磁',3]], '鋼ダメ増ビルド')
    ]),
    hero('ルネ', [
      build([['全軍突撃',7], ['破壊不能',7], ['衝撃',3], ['振動',3], ['衝撃',3], ['振動',3]], '衰弱ビルド'),
      build([['戦場洞察',3], ['破壊不能',3], ['戦場洞察',3], ['補足不能',3], ['戦場洞察',3], ['補足不能',3]], 'ダメ増減ビルド')

    ]) ],
  // P2
  [ hero('立華つむぎ', [build([['砲撃の嵐',7], ['補足不能',3], ['戦場洞察',7], ['補足不能',7], ['戦場洞察',7], ['補足不能',7]], '砲撃ビルド')]),
    hero('メル',       [build([['戦場洞察',3], ['鋼の奔流',7], ['戦場洞察',7], ['補足不能',7], ['戦場洞察',7], ['補足不能',7]], '鋼ビルド')]),

      build([['戦場洞察',3], ['破壊不能',3], ['戦場洞察',3], ['補足不能',3], ['戦場洞察',3], ['補足不能',3]], 'ダメ増減ビルド')
    ]) ],
  // P3
  [ hero('アデル',   [

    ]),
    hero('ソフィ',   [

      build([['灼熱',3], ['点火',3], ['灼熱',3], ['点火',3], ['灼熱',3], ['点火',3]], '燃焼'),
      build([['全軍突撃',7], ['鋼の奔流',7], ['戦場洞察',3], ['補足不能',7], ['戦場洞察',3], ['補足不能',7]], '堅実'),
      build([['破鎧',7], ['重撃',7], ['戦場洞察',3], ['重撃',7], ['戦場洞察',3], ['重撃',7]], '妥協')

    ]) ],
  // P4
  [ hero('マリナ',   [build([['砲撃の嵐',7], ['補足不能',3], ['戦場洞察',7], ['補足不能',7], ['戦場洞察',7], ['補足不能',7]], '砲撃ビルド')]),
    hero('ピスカ',   [
      build([['全軍突撃',7], ['鋼の奔流',7], ['戦場洞察',7], ['補足不能',7], ['戦場洞察',7], ['補足不能',7]], 'おすすめ例１')
    ]),
    hero('アイリス', [build([['全軍突撃',7], ['破壊不能',7], ['衝撃',3], ['振動',3], ['衝撃',3], ['振動',3]], 'おすすめ例１')]) ],

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const heroImg   = h => h.img || `${IMAGE_CONFIG.heroDir}${encodeURIComponent(h.name)}.${IMAGE_CONFIG.ext}`;

// 画像の読み込み結果に応じて、プレースホルダーを出し分ける
const IMG_ATTR = 'loading="lazy" onload="this.parentNode.classList.add(\'has-img\')" onerror="this.remove()"';

// edit = 編集できる枠のとき { hero, idx }
function slotHTML(def, entry, where, edit) {
  const [effName, rawLv, imgOverride] = entry || [];
  let eff = null;
  if (effName) {
    eff = def.effects.find(e => e[0] === effName);
    if (!eff) console.warn(`[${where}] 「${def.label}」に「${effName}」という効果はありません`);
  }
  const editAttrs = edit ? ' is-editable' : '';
  const editBtn = edit ? `<button type="button" class="slot-edit" data-hero="${esc(edit.hero)}" data-slot="${edit.idx}" aria-label="${esc(def.label)}の秘石を編集"></button>` : '';
  if (!eff) {
    return `<li class="slot is-empty${editAttrs}" data-kind="${def.kind}" title="${esc(def.label)}">
      <span class="slot-name">${icon(def.key)}${esc(def.label)}</span>
      <span class="slot-img"><span class="slot-ph">${icon(def.key)}</span></span>
      <span class="slot-eff"><b>${effName ? esc(effName) + '（不明）' : '未設定'}</b><small></small></span>
      <span class="slot-lv"></span>${editBtn}
    </li>`;
  }
  const [name, desc, max] = eff;
  const lv = Math.min(Math.max(parseInt(rawLv, 10) || 1, 1), max);
  if (lv !== rawLv) console.warn(`[${where}] 「${name}」のLvは 1〜${max} です（指定: ${rawLv}）`);
  const pips = Array.from({ length: max }, (_, i) => `<i${i < lv ? ' class="on"' : ''}></i>`).join('');
  return `<li class="slot${editAttrs}" data-kind="${def.kind}" title="${esc(def.label)}：${esc(name)} Lv${lv}">
    <span class="slot-name">${icon(def.key)}${esc(def.label)}</span>
    <span class="slot-img"><span class="slot-ph">${icon(def.key)}</span><img src="${esc(effectImg(name, imgOverride))}" alt="${esc(name)}" ${IMG_ATTR}></span>
    <span class="slot-eff"><b>${esc(name)}</b><small>${esc(desc)}</small></span>
    <span class="slot-lv"><span class="lv-num">Lv${lv}</span><span class="pips" aria-hidden="true">${pips}</span></span>${editBtn}
  </li>`;
}

function editBarHTML(h) {
  const hn = esc(h.name);
  const copyFrom = h.builds.length
    ? `<select class="copy-from" data-hero="${hn}" aria-label="他のプリセットから複製"><option value="">複製元を選ぶ</option>${
        h.builds.map((b, k) => `<option value="${k}">${esc(b.label || 'おすすめ例' + (k + 1))}</option>`).join('')}</select>`
    : '';
  return `<div class="edit-bar">
    <span class="edit-tag">✎ 自分で選ぶ：枠を押して秘石とLvを選べます（自動保存）</span>
    ${copyFrom}
    <button type="button" class="btn-sm" data-act="reset" data-hero="${hn}">リセット</button>
    <button type="button" class="btn-sm btn-accent" data-act="copy-hero" data-hero="${hn}">この英雄をJSONコピー</button>
  </div>`;
}

function buildHTML(h, b, where) {
  if (b.slots.length !== SLOTS.length) console.warn(`[${where}] スロットは${SLOTS.length}個必要です`);
  const items = SLOTS.map((def, i) => slotHTML(def, b.slots[i], where, b.editable ? { hero: h.name, idx: i } : null)).join('');
  const note = b.note ? `<p class="build-note">${esc(b.note)}</p>` : '';
  const bar = b.editable ? editBarHTML(h) : '';
  const foot = (note || bar) ? `<div class="build-foot">${note}${bar}</div>` : '';
  return `<section class="build${b.editable ? ' is-edit' : ''}" data-hero="${esc(h.name)}"><ul class="slots">${items}</ul>${foot}</section>`;
}

function heroCardHTML(h, n, i, teamHasTabs) {
  const list = buildsOf(h);
  const many = list.length > 1;
  const gid = `b-t${n}h${i}`;
  const radios = many ? list.map((_, k) => `<input class="sr build-radio" type="radio" name="${gid}" id="${gid}-${k}"${k === 0 ? ' checked' : ''}>`).join('') : '';
  const tabs = many
    ? `<div class="build-tabs">${list.map((b, k) => `<label for="${gid}-${k}">${esc(b.label || 'おすすめ例' + (k + 1))}</label>`).join('')}</div>`
    : teamHasTabs ? `<div class="build-tabs"><span class="build-tag">${esc(list[0].label || 'おすすめ例')}</span></div>` : '';
  const builds = list.map((b, k) => buildHTML(h, b, `P${n} ${h.name} ${b.label || k + 1}`)).join('');
  return `<article class="hero-card">
    ${radios}
    <button type="button" class="tip-btn" data-tip="${esc(h.name)}" aria-label="${esc(h.name)}の秘石の選び方を開く">
      <span class="q" aria-hidden="true">?</span><span class="label">秘石の選び方</span>
    </button>
    <header class="hero-head">
      <span class="portrait"><span class="portrait-ph">${esc([...h.name][0])}</span><img src="${esc(heroImg(h))}" alt="" ${IMG_ATTR}></span>
      <h3 class="hero-name">${esc(h.name)}</h3>
      ${h.note ? `<p class="hero-note">${esc(h.note)}</p>` : ''}
    </header>
    ${tabs}
    <div class="builds">${builds}</div>
  </article>`;
}

function panelHTML(heroes, n) {
  const checks = heroes.map((_, i) => `<input class="sr hero-check" type="checkbox" id="t${n}h${i}" checked>`).join('');
  const chips  = heroes.map((h, i) => `<label class="chip" for="t${n}h${i}">${esc(h.name)}</label>`).join('');
  const maxBuilds = Math.max(...heroes.map(h => buildsOf(h).length));
  const cards  = heroes.map((h, i) => heroCardHTML(h, n, i, maxBuilds > 1)).join('');
  return `<section class="team-panel" aria-label="P${n}" style="--tabs:${maxBuilds}">
    ${checks}
    <div class="hero-filter">
      <span class="filter-label">表示する英雄</span>${chips}
      <button type="button" class="btn-sm btn-accent copy-team" data-act="copy-team" data-team="${n}" title="この編成の3英雄について、「自分で選ぶ」の内容をJSONでコピーします">この編成をJSONコピー</button>
    </div>
    <div class="hero-grid">${cards}</div>
    <p class="hero-empty">表示する英雄を1体以上選んでください。</p>
  </section>`;
}

function render() {
  let radios = '', nav = '', panels = '';
  TEAMS.forEach((heroes, idx) => {
    const n = idx + 1;
    radios += `<input class="sr team-radio" type="radio" name="team" id="team-${n}"${idx === 0 ? ' checked' : ''}>`;
    nav    += `<label class="team-btn" for="team-${n}"><span class="team-no">P${n}</span><span class="team-heroes">${heroes.map(h => `<span>${esc(h.name)}</span>`).join('・')}</span></label>`;
    panels += panelHTML(heroes, n);
  });
  const modeSwitch = `<div class="topbar"><div class="mode-switch" role="radiogroup" aria-label="表示形式">
      <input class="sr" type="radio" name="mode" id="mode-simple" value="simple"><label for="mode-simple">シンプル表示</label>
      <input class="sr" type="radio" name="mode" id="mode-game" value="game"><label for="mode-game">ゲーム表示</label>
    </div></div>`;
  document.getElementById('app').innerHTML = `${radios}${modeSwitch}<nav class="team-nav" aria-label="編成">${nav}</nav><div class="panels">${panels}</div>`;

  document.getElementById('ref-grid').innerHTML = SLOTS.map(def => `
    <div class="ref-slot" data-kind="${def.kind}">
      <h3>${icon(def.key)}${esc(def.label)}</h3>
      <ul>${def.effects.map(([name, desc, max]) => `<li>${esc(name)}<span>${esc(desc)}（〜Lv${max}）</span></li>`).join('')}</ul>
    </div>`).join('');

  document.getElementById('stone-info-grid').innerHTML = STONE_ORDER.map(stone => {
    const info = STONE_INFO[stone] || {};
    const lvHTML = (info.levels || []).map((v, i) => v === '' || v == null ? '' : `<span class="stone-info-lv"><b>Lv${i + 1}</b>${esc(String(v))}</span>`).join('');
    return `
    <div class="stone-info-card" data-kind="${STONE_KIND[stone]}">
      <div class="stone-info-head">
        <span class="stone-info-name">${esc(stone)}</span>
        <span class="stone-info-desc">${esc(info.desc || '')}</span>
      </div>
      <div class="stone-info-levels">${lvHTML}</div>
      <p class="stone-info-note">${esc(info.note || '')}</p>
    </div>`;
  }).join('');

  document.getElementById('notice').hidden = !SHOW_SAMPLE_NOTICE;
  setMode(store.get(STORAGE.mode, 'simple'), false);
}

/* =========================================================
   表示形式
   ========================================================= */
function setMode(mode, save = true) {
  if (mode !== 'game') mode = 'simple';
  document.getElementById('app').dataset.mode = mode;
  document.getElementById('mode-' + mode).checked = true;
  if (save) store.set(STORAGE.mode, mode);
}

/* =========================================================
   編集
   ========================================================= */
function saveEdits() { store.set(STORAGE.edits, edits); }

// 「自分で選ぶ」だけを差し替える（編成・英雄・プリセットの選択状態はそのまま残る）
function refreshEdit(name) {
  const info = HERO_INDEX[name];
  if (!info) return;
  const b = buildsOf(info.hero).find(x => x.editable);
  document.querySelectorAll('.build.is-edit').forEach(el => {
    if (el.dataset.hero === name) el.outerHTML = buildHTML(info.hero, b, `${name} 自分で選ぶ`);
  });
}

function setSlot(name, idx, entry) {
  const slots = getEdit(name).slice();
  slots[idx] = entry;
  edits[name] = slots;
  saveEdits();
  refreshEdit(name);
}

function resetEdit(name) { delete edits[name]; saveEdits(); refreshEdit(name); }

function copyFromPreset(name, k) {
  const b = HERO_INDEX[name].hero.builds[k];
  if (!b) return;
  edits[name] = normSlots(b.slots);
  saveEdits();
  refreshEdit(name);
}

/* ---------- 秘石ピッカー ---------- */
const picker = document.getElementById('picker');
let pk = null; // { hero, slot }

function openPicker(hero, slot) { pk = { hero, slot }; renderPicker(); picker.showModal(); }

function renderPicker() {
  const def = SLOTS[pk.slot];
  const cur = getEdit(pk.hero)[pk.slot];
  const curEff = cur ? cur[0] : '';
  const curDef = def.effects.find(e => e[0] === curEff);
  const max = curDef ? curDef[2] : 0;
  const curLv = cur ? cur[1] : 0;

  const prevKey = document.activeElement && picker.contains(document.activeElement) ? document.activeElement.dataset.pk : null;

  const effList = [...def.effects].sort((a, b) =>
    gradeScore(pickerGrade(def.key, a[0], (STONE_GRADES[pk.hero] || {})[a[0]])) -
    gradeScore(pickerGrade(def.key, b[0], (STONE_GRADES[pk.hero] || {})[b[0]])));
  const effBtns = effList.map(([name, desc]) => `
    <button type="button" class="pk-eff" data-kind="${def.kind}" data-pk="eff:${esc(name)}" data-eff="${esc(name)}" aria-pressed="${name === curEff}">
      <span class="pk-thumb"><span class="slot-ph">${icon(def.key)}</span><img src="${esc(effectImg(name))}" alt="" ${IMG_ATTR}></span>
      <b>${esc(name)}</b><small>${esc(desc)}</small>${gradeBadge(pickerGrade(def.key, name, (STONE_GRADES[pk.hero] || {})[name]), 'pk-grade')}
    </button>`).join('');
  const lvBtns = max
    ? Array.from({ length: max }, (_, i) => `<button type="button" data-pk="lv:${i + 1}" data-lv="${i + 1}" aria-pressed="${i + 1 === curLv}">Lv${i + 1}</button>`).join('')
    : '<span class="pk-none-hint">秘石を選ぶとレベルを選べます。</span>';

  document.getElementById('pk-body').innerHTML = `
    <div class="dlg-head">
      <span class="dlg-title" id="pk-title">${esc(pk.hero)}／${icon(def.key)} ${esc(def.label)}</span>
      <button type="button" class="btn-sm btn-accent" data-close data-pk="close">完了</button>
    </div>
    <p class="dlg-sub">秘石</p>
    <div class="pk-list">
      ${effBtns}
      <button type="button" class="pk-eff pk-none" data-pk="none" data-eff="" aria-pressed="${!curEff}"><b>未設定にする</b></button>
    </div>
    <p class="dlg-sub">レベル</p>
    <div class="pk-lv">${lvBtns}</div>`;

  if (prevKey) { const t = [...picker.querySelectorAll('[data-pk]')].find(el => el.dataset.pk === prevKey); if (t) t.focus(); }
}

picker.addEventListener('click', e => {
  if (e.target === picker) { picker.close(); return; }             // 背景クリックで閉じる
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.hasAttribute('data-close')) { picker.close(); return; }
  const def = SLOTS[pk.slot];
  if (btn.dataset.eff !== undefined) {
    const name = btn.dataset.eff;
    const d = def.effects.find(x => x[0] === name);
    const cur = getEdit(pk.hero)[pk.slot];
    const keep = cur && cur[0] === name ? cur[1] : null;             // 同じ秘石ならLvを維持
    setSlot(pk.hero, pk.slot, d ? [name, keep || d[2]] : null);      // 新しく選んだら最大Lv
    renderPicker();
  } else if (btn.dataset.lv) {
    const cur = getEdit(pk.hero)[pk.slot];
    if (cur) { setSlot(pk.hero, pk.slot, [cur[0], parseInt(btn.dataset.lv, 10)]); renderPicker(); }
  }
});

/* ---------- 秘石の選び方ドロワー ---------- */
const tipsDlg = document.getElementById('tipsdlg');

// S+ 〜 F を色付け。基準色はランク(S/A/B/C/D/E)ごと、+/- で明るさを調整。
// extraClass: 表示先ごとの微調整用（省略可）
const GRADE_TIER_COLOR = { S: '#fb7185', A: '#fb923c', B: '#4ade80', C: '#38bdf8', D: '#a78bfa', E: '#94a3b8' };
function gradeBadge(grade, extraClass) {
  const cls = extraClass ? ` ${extraClass}` : '';
  if (!grade || grade === 'NA') return `<span class="grade g-na${cls}">NA</span>`;
  if (grade === 'F') return `<span class="grade g-f${cls}">F</span>`;
  const tier = grade[0];
  const suf = grade.slice(1);
  const bright = suf === '+' ? 1.18 : suf === '-' ? 0.8 : 1;
  const color = GRADE_TIER_COLOR[tier] || '#64748b';
  return `<span class="grade${cls}" style="--g-color:${color};--g-bright:${bright}">${esc(grade)}</span>`;
}

// 評価の並べ替え用スコア（小さいほど評価が高い）。S~E の文字グレード > NA > F の順。
function gradeScore(grade) {
  if (!grade || grade === 'F') return 101;
  if (grade === 'NA') return 100;
  const tierScore = { S: 0, A: 1, B: 2, C: 3, D: 4, E: 5 }[grade[0]];
  if (tierScore === undefined) return 99;
  const suf = grade.slice(1);
  const sufScore = suf === '+' ? 0 : suf === '-' ? 2 : 1;
  return tierScore * 10 + sufScore;
}

// 評価を一段階下げる（S+→S→S-→A+→…→E-→F の順で1段下げる）。
// ライフルの「戦場洞察」／アーマーの「補足不能」は、Lv上限が他スロットより低いぶん評価を下げて表示する。
const GRADE_TIER_ORDER = ['S', 'A', 'B', 'C', 'D', 'E'];
function stepDownGrade(grade) {
  if (!grade || grade === 'F' || grade === 'NA') return grade;
  const tier = grade[0];
  const suf = grade.slice(1);
  const tierIdx = GRADE_TIER_ORDER.indexOf(tier);
  if (tierIdx === -1) return grade;
  if (suf === '+') return tier;
  if (suf === '') return tier + '-';
  const nextTier = GRADE_TIER_ORDER[tierIdx + 1];
  return nextTier ? nextTier + '+' : 'F';
}

// 秘石選択画面で表示する評価。ライフルの戦場洞察／アーマーの補足不能のみ一段階下げる。
function pickerGrade(slotKey, stoneName, grade) {
  const downgrade = (slotKey === 'rifle' && stoneName === '戦場洞察') || (slotKey === 'armor' && stoneName === '補足不能');
  return downgrade ? stepDownGrade(grade) : grade;
}

let tipSortMode = 'grade';   // 'grade' = 評価が高い順（S~E > NA > F） / 'slot' = 部位の並び順（既定）
let currentTipHero = null;

function renderTips(name) {
  currentTipHero = name;
  const desc = HERO_TIPS[name];
  const descHTML = desc
    ? `<p class="tip-desc">${esc(desc)}</p>`
    : `<p class="tip-desc is-placeholder">（${esc(name)}の秘石の選び方は準備中です。スクリプト内の HERO_TIPS に説明文を追加すると、ここに表示されます。）</p>`;

  const grades = STONE_GRADES[name] || {};
  const stones = tipSortMode === 'grade'
    ? [...STONE_ORDER].sort((a, b) => gradeScore(grades[a]) - gradeScore(grades[b]))
    : STONE_ORDER;
  const rows = stones.map(stone => `
    <div class="tip-row" data-kind="${STONE_KIND[stone]}">
      <span class="stone-name">${esc(stone)}</span>
      ${gradeBadge(grades[stone])}
    </div>`).join('');

  document.getElementById('tip-body').innerHTML = `
    <div class="dlg-head">
      <span class="dlg-title" id="tip-title">${esc(name)}の秘石の選び方</span>
      <button type="button" class="btn-sm" data-close>閉じる</button>
    </div>
    ${descHTML}
    <div class="dlg-sub-row">
      <p class="dlg-sub">秘石ごとの評価</p>
      <div class="tip-sort" role="group" aria-label="並べ替え">
        <button type="button" class="btn-sm${tipSortMode === 'grade' ? ' btn-accent' : ''}" data-sort="grade">評価が高い順</button>
        <button type="button" class="btn-sm${tipSortMode === 'slot' ? ' btn-accent' : ''}" data-sort="slot">部位順</button>
      </div>
    </div>
    <div class="tip-legend"><b>S &gt; A &gt; B &gt; C &gt; D &gt; E</b>（高いほど強い）　<span class="grade g-na" style="min-width:auto">NA</span>単独で評価できない　<span class="grade g-f" style="min-width:auto">F</span>効果なし</div>
    <div class="tip-table">${rows}</div>`;
}

function openTips(name) { renderTips(name); tipsDlg.showModal(); }

tipsDlg.addEventListener('click', e => {
  if (e.target === tipsDlg || e.target.closest('[data-close]')) { tipsDlg.close(); return; }
  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn && currentTipHero) { tipSortMode = sortBtn.dataset.sort; renderTips(currentTipHero); }
});

/* ---------- JSON コピー ----------
   出力は TEAMS にそのまま貼れる形式（slots は [効果名, Lv] / 未設定は null）。 */
const EXPORT_LABEL = 'おすすめ';
const exportHero = h => ({ name: h.name, builds: [{ label: EXPORT_LABEL, note: '', slots: normSlots(getEdit(h.name)) }] });
const exportTeam = n => ({ team: n, heroes: TEAMS[n - 1].map(exportHero) });

function toJSONText(obj) {
  // 短い配列（スロット）は1行にまとめて読みやすくする
  return JSON.stringify(obj, null, 2).replace(
    /\[\s*((?:"(?:[^"\\]|\\.)*"|\d+)(?:\s*,\s*(?:"(?:[^"\\]|\\.)*"|\d+))*)\s*\]/g,
    (_, inner) => '[' + inner.replace(/\s*\n\s*/g, ' ') + ']'
  );
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

async function copyJSON(obj, message) {
  const text = toJSONText(obj);
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = legacyCopy(text); }
  if (ok) { toast(message); return; }
  const box = document.getElementById('jsonbox');
  document.getElementById('json-text').value = text;
  box.showModal();
  document.getElementById('json-text').select();
}
document.getElementById('jsonbox').addEventListener('click', e => {
  if (e.target.id === 'jsonbox' || e.target.hasAttribute('data-close')) e.target.closest('dialog').close();
});

/* ---------- イベント ---------- */
document.addEventListener('click', e => {
  const tipBtn = e.target.closest('.tip-btn');
  if (tipBtn) { openTips(tipBtn.dataset.tip); return; }

  const editBtn = e.target.closest('.slot-edit');
  if (editBtn) { openPicker(editBtn.dataset.hero, parseInt(editBtn.dataset.slot, 10)); return; }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const hero = act.dataset.hero;
  switch (act.dataset.act) {
    case 'reset':     resetEdit(hero); toast(`${hero}の「自分で選ぶ」をリセットしました`); break;
    case 'copy-hero': copyJSON({ team: HERO_INDEX[hero].team, heroes: [exportHero(HERO_INDEX[hero].hero)] }, `${hero}の編集内容をコピーしました`); break;
    case 'copy-team': copyJSON(exportTeam(parseInt(act.dataset.team, 10)), `P${act.dataset.team} の編集内容をコピーしました`); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.name === 'mode') { setMode(e.target.value); return; }
  if (e.target.classList.contains('copy-from') && e.target.value !== '') {
    copyFromPreset(e.target.dataset.hero, parseInt(e.target.value, 10));
  }
});

render();
</script>
